version: "3.7"

services:
  app_proxy:
    environment:
      # Formato: <app-id>_<serviço>_1
      APP_HOST: extras-dispatcharr_server_1
      APP_PORT: 9191
      # Listas M3U, EPG, HDHomeRun e streams são abertos por TVs e players,
      # que não fazem o login do Umbrel. O Dispatcharr tem login próprio.
      PROXY_AUTH_ADD: "false"

  server:
    # Imagem "AIO": Postgres e Redis dentro do próprio container.
    # A chave secreta do Django é gerada na primeira execução e fica em /data/jwt.
    image: ghcr.io/dispatcharr/dispatcharr:0.34.1@sha256:3716ebb0aba133fe8b3d311505dc49966b7fddff742d9ab710ccd19d04658195
    restart: on-failure
    stop_grace_period: 1m
    shm_size: 1gb
    mem_limit: 4g
    environment:
      DISPATCHARR_ENV: aio
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      DISPATCHARR_LOG_LEVEL: info
      # Menos processos para economizar RAM no Umbrel (cada um usa uns 200 MB).
      # Os padrões são 4 processos web e até 6 de tarefas, para servidores grandes.
      # Numa casa, 2 processos web (gevent) atendem vários streams ao mesmo tempo,
      # e 2 de tarefas dão conta das atualizações de EPG e M3U.
      UWSGI_WORKERS: "2"
      CELERY_MAX_WORKERS: "2"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
