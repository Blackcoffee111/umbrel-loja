version: "3.7"

services:
  app_proxy:
    environment:
      # Formato: <app-id>_<serviço>_1
      APP_HOST: extras-shelfmark_server_1
      APP_PORT: 8084

  server:
    # Imagem padrão (com Chromium embutido para passar pelo Cloudflare/DDoS-Guard).
    # Pede ~2 GB de RAM livres só quando usa Download Direto.
    image: ghcr.io/calibrain/shelfmark:v1.7.0@sha256:6544e02595271b0267b9acda58fa7f3db6f14942bece51b7aadfe4000cf34f1c
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      # Configuração, banco de dados e cache de capas do Shelfmark
      - ${APP_DATA_DIR}/data/config:/config
      # Destino dos livros = pasta de entrada do Calibre-Web Automated,
      # que importa cada arquivo sozinho para a biblioteca
      - ${UMBREL_ROOT}/app-data/calibre-web-automated/data/book-ingest:/books
      # Mesma pasta e mesmo caminho (/downloads) que o Transmission usa,
      # para o Shelfmark achar o que vier por torrent
      - ${UMBREL_ROOT}/home/Downloads:/downloads
